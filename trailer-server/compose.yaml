# Lancement : docker compose up -d --build   (dans ce dossier, sur le NAS)
services:
  aurora-trailers:
    build:
      context: .
      args:
        # Pour mettre yt-dlp à jour : changer cette date, puis reconstruire le projet.
        YTDLP_REFRESH: "2026-11-01"
    container_name: aurora-trailers
    ports:
      - "8787:8787"   # réseau local uniquement : ne pas rediriger ce port depuis la box
    volumes:
      # Stockage géré par Docker : créé automatiquement, avec les bons droits.
      - trailers-cache:/cache
    environment:
      CACHE_MAX_MB: "4000"   # taille maximale du cache (les moins vues sont supprimées)
      MAX_HEIGHT: "1080"
    restart: unless-stopped

volumes:
  trailers-cache:
