# Lancement : docker compose up -d --build   (dans ce dossier, sur le NAS)
services:
  aurora-trailers:
    build: .
    container_name: aurora-trailers
    ports:
      - "8787:8787"   # réseau local uniquement : ne pas rediriger ce port depuis la box
    volumes:
      - ./cache:/cache
    environment:
      CACHE_MAX_MB: "4000"   # taille maximale du cache (les moins vues sont supprimées)
      MAX_HEIGHT: "1080"
    # Sur Synology, si le dossier cache n'est pas accessible en écriture,
    # décommentez et mettez l'UID:GID de votre utilisateur (commande « id »).
    # user: "1026:100"
    restart: unless-stopped
