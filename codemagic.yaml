# Builds d'Aurora sur Codemagic (Mac mini M2, offre gratuite : 500 minutes macOS par mois).
# Même chaîne que .github/workflows/build.yml : tests, IPA Apple TV et iPad non signées et
# vérifiées, Release GitHub « build-NNN » (suivie par atvloadly).
#
# Secret requis, saisi dans Codemagic (jamais dans ce dépôt) : groupe de variables « github »
# contenant GITHUB_TOKEN, jeton GitHub limité au dépôt popolski/aurora-tv avec la permission
# « Contents : Read and write » (voir docs/DEPLOYMENT.md).
#
# Numéro de build : BUILD_NUMBER de Codemagic + 100, pour rester au-dessus des builds faits
# par GitHub Actions (jusqu'à 63) : atvloadly et tvOS voient toujours une version plus récente.

workflows:
  aurora:
    name: Aurora (Apple TV et iPad)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 27.1
      groups:
        - github
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.spm
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Version
        script: |
          AURORA_BUILD=$((BUILD_NUMBER + 100))
          MARKETING=$(grep -E '^\s+MARKETING_VERSION:' project.yml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "AURORA_BUILD=$AURORA_BUILD" >> "$CM_ENV"
          echo "AURORA_VERSION=$MARKETING" >> "$CM_ENV"
          echo "Aurora $MARKETING (build $AURORA_BUILD) — commit ${CM_COMMIT:0:8}"
          xcodebuild -version

      - name: Tests du service du NAS (Python)
        script: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "pillow==11.0.0"
          cd trailer-server
          /tmp/venv/bin/python -m unittest test_server test_topshelf test_localize test_discovery

      - name: Tests LanterneCore (swift test)
        script: |
          set -o pipefail
          cd Packages/LanterneCore
          swift test 2>&1 | tail -n 40

      - name: XcodeGen et dépendances
        script: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Lanterne.xcodeproj -scheme Lanterne \
            -clonedSourcePackagesDirPath .spm | tail -n 5

      - name: Application Apple TV (IPA)
        script: |
          set -o pipefail
          xcodebuild build \
            -project Lanterne.xcodeproj -scheme Lanterne -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/dd -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=$AURORA_BUILD > build-tvos.log 2>&1 \
            || { grep -E "error:" build-tvos.log | sort -u | head -n 60; exit 1; }
          bash scripts/fakesign.sh build/dd/Build/Products/Release-appletvos/Lanterne.app
          IPA="dist/Aurora-AppleTV-$AURORA_VERSION-$AURORA_BUILD-unsigned.ipa"
          bash scripts/package-ipa.sh build/dd/Build/Products/Release-appletvos/Lanterne.app "$IPA"
          bash scripts/verify-ipa.sh "$IPA" io.github.popolski.lanterne

      - name: Application iPad (IPA)
        script: |
          set -o pipefail
          xcodebuild build \
            -project Lanterne.xcodeproj -scheme AuroraPad -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=$AURORA_BUILD > build-ipad.log 2>&1 \
            || { grep -E "error:" build-ipad.log | sort -u | head -n 60; exit 1; }
          IPA="dist/Aurora-iPad-$AURORA_VERSION-$AURORA_BUILD-unsigned.ipa"
          bash scripts/package-ipa.sh build/dd/Build/Products/Release-iphoneos/Aurora.app "$IPA"
          bash scripts/verify-ipa.sh "$IPA" io.github.popolski.lanterne
          (cd dist && shasum -a 256 *.ipa | tee SHA256SUMS.txt)

      - name: Release GitHub (suivie par atvloadly)
        script: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN absent (groupe « github » de Codemagic) : pas de Release publiée."
            exit 1
          fi
          export GH_TOKEN="$GITHUB_TOKEN"
          TAG="build-$AURORA_BUILD"
          cat > notes.md <<NOTES
          IPA **non signées** : \`Aurora-AppleTV-…\` pour l'Apple TV, \`Aurora-iPad-…\` pour l'iPad
          (atvloadly, ou Sideloadly pour l'iPad ; voir docs/IPAD.md). Construites par Codemagic.
          Commit : $CM_COMMIT
          NOTES
          gh release create "$TAG" dist/*.ipa dist/SHA256SUMS.txt \
            --repo popolski/aurora-tv --target "$CM_COMMIT" \
            --title "Aurora $AURORA_VERSION (build $AURORA_BUILD)" --notes-file notes.md --latest
          echo "Release : https://github.com/popolski/aurora-tv/releases/tag/$TAG"

    artifacts:
      - dist/*.ipa
      - dist/SHA256SUMS.txt
      - build-*.log
